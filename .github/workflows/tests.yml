# Runs the test suite on every push and pull request.
# The tests use only tiny synthetic DICOM files (tests/data/input), so no data download and no GPU are needed.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install -r requirements-ci.txt
          pip install -e .
      - name: Run tests with coverage
        run: python -m pytest -q --cov=fpdeid --cov-report=term tests
