[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fpdeid"
version = "0.1.0"
description = "Fingerprint-guided, closed-loop DICOM de-identification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# the pipeline does its work in worker processes; measure them too
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
source = ["fpdeid"]
